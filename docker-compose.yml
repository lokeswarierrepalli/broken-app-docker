services:
  web:
    image: broken-app:optimized
    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
